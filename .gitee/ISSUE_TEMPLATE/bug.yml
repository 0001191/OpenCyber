name: Bug 报告
description: 提交问题反馈帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 环境信息
  - type: input
    id: version
    attributes:
      label: OpenCyber 版本
      description: opencyber --version 输出
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: Windows / macOS / Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述发生了什么
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何复现这个问题
      placeholder: "1. 执行 opencyber\n2. 输入...\n3. 报错..."
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图
      render: shell
